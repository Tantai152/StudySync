name: E2E Tests

on:
  pull_request:
    branches: ["main", "develop"]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: studysync
          MYSQL_USER: studysync
          MYSQL_PASSWORD: studysync
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Backend runtime config
      NODE_ENV: test
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: mysql://studysync:studysync@127.0.0.1:3306/studysync
      # The Prisma MariaDB adapter reads the discrete DB_* variables, not
      # DATABASE_URL, so they must be set explicitly for CI.
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: studysync
      DB_PASSWORD: studysync
      DB_NAME: studysync
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      ACCESS_TOKEN_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 7d
      # Frontend runtime config
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      VITE_SOCKET_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Playwright test runner (root)
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Sync database schema
        working-directory: ./backend
        # The committed migrations stop at invites; message/study_session
        # tables were created with `db push` in development. Keep CI in sync
        # with the schema.prisma source of truth.
        run: npx prisma db push

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend
        working-directory: ./backend
        run: nohup npm run dev > /tmp/backend.log 2>&1 &

      - name: Start frontend
        working-directory: ./frontend
        run: nohup npm run dev -- --host 127.0.0.1 > /tmp/frontend.log 2>&1 &

      - name: Wait for servers to be ready
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:5173 > /dev/null \
              && curl -sf http://localhost:3000/api/v1/health/health > /dev/null; then
              echo "Servers are ready"
              exit 0
            fi
            sleep 2
          done
          echo "Servers did not become ready in time"
          echo "--- backend log ---"
          tail -n 100 /tmp/backend.log || true
          echo "--- frontend log ---"
          tail -n 100 /tmp/frontend.log || true
          exit 1

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "--- backend log ---"
          tail -n 200 /tmp/backend.log || true
          echo "--- frontend log ---"
          tail -n 200 /tmp/frontend.log || true
