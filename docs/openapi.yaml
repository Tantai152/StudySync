          default: 0
        createdAt:
          type: string
          format: date-time

    DashboardStats:
      type: object
      required: [from, to, totalSeconds, sessionCount]
      properties:
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        totalSeconds:
          type: integer
        sessionCount:
          type: integer
        bySubject:
          type: array
          items:
            type: object
            properties:
              subject:
                type: string
              seconds:
                type: integer

    HealthData:
      type: object
      required: [status, uptime, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        uptime:
          type: number
          description: Process uptime in seconds.
        timestamp:
          type: string
          format: date-time